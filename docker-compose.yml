# Pocket Photo Lab — edit your pictures (Go + SQLite). One container, one volume.
services:
  pocket-photolab:
    image: ghcr.io/abjelosevic88/pocket-homelab-photo-lab:latest
    container_name: pocket-photolab
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The owner's own connections; everything can also be set under Settings.
      PHOTOS_URL: ${PHOTOS_URL:-}
      PHOTOS_TOKEN: ${PHOTOS_TOKEN:-}
      FILES_URL: ${FILES_URL:-}
      FILES_TOKEN: ${FILES_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # MAX_UPLOAD_BYTES: "209715200"   # one picture, 200 MB
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data   # the database and every picture (data/images)
    extra_hosts:
      - "host.docker.internal:host-gateway"
